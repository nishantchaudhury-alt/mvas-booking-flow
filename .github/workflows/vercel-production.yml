name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy mvas-booking-flow
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Pull production settings
        run: npx --yes vercel@62.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployment
        run: npx --yes vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: npx --yes vercel@62.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
