<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F1F5F9; font-family: "Inter", system-ui, sans-serif; color: #0F172A; }
  * { box-sizing: border-box; }
  #root { height: 100vh; }
  button { font-family: inherit; }

  /* Accessibility floor for the compact operations UI. WCAG does not mandate
     a single minimum pixel size, but text must remain usable when enlarged to
     200%. The previous 8–10.5px metadata was difficult to read before zoom and
     became fragile at higher magnification, so visible UI copy now starts at
     11px while headings and standard controls retain their larger sizes. */
  [style*="font-size: 7.5px"], [style*="font-size: 8px"], [style*="font-size: 8.5px"],
  [style*="font-size: 9px"], [style*="font-size: 9.5px"],
  [style*="font-size: 10px"], [style*="font-size: 10.5px"] {
    font-size: 11px !important;
  }

  /* Inputs must remain identifiable without relying on a low-contrast hairline.
     Keep the normal structural line token for cards and rows; use this stronger
     boundary only where the line communicates an editable control. */
  input:not([type="checkbox"]):not([type="radio"]), textarea, select {
    border-color: #7C8B9F !important;
  }
  input::placeholder, textarea::placeholder {
    color: #5F6F85;
    opacity: 1;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
  [role="button"]:focus-visible, [role="switch"]:focus-visible, [role="tab"]:focus-visible {
    outline: 2px solid #1B2434;
    outline-offset: 2px;
  }

  /* Traveler cards are disclosure controls: the whole summary opens the
     profile editor. Hover/focus belongs to the full row, not a detached CTA. */
  .traveler-card-trigger {
    transition: background-color 140ms ease, box-shadow 140ms ease;
  }
  .traveler-card-trigger:hover {
    background: #F8FAFC !important;
  }
  .traveler-card-trigger[aria-expanded="true"] {
    background: #EFF6FF !important;
  }
  .traveler-card-trigger:focus-visible {
    outline: 2px solid #1B2434;
    outline-offset: -2px;
    box-shadow: inset 0 0 0 1px #DBEAFE;
  }

  /* At 200% page zoom the browser exposes roughly half the CSS viewport.
     This is a desktop operations workspace, so preserve its three-column
     information architecture and make it horizontally pannable instead of
     allowing the fixed navigation and summary rail to crush the work area. */
  @media (max-width: 1100px) {
    html, body, #root {
      min-width: 1180px;
      overflow-x: auto;
    }
  }
  /* Hide scrollbars globally while preserving scroll */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* The stateroom dialog can exceed the viewport. Unlike passive page rails,
     that task scroll must stay discoverable so the deck inventory and fixed
     footer never appear clipped. */
  .stateroom-modal-scroll,
  .stateroom-deck-scroll {
    scrollbar-width: thin;
    scrollbar-color: #CBD5E1 transparent;
  }
  .stateroom-modal-scroll::-webkit-scrollbar {
    display: block;
    width: 6px;
  }
  .stateroom-deck-scroll::-webkit-scrollbar {
    display: block;
    width: 5px;
  }
  .stateroom-modal-scroll::-webkit-scrollbar-track,
  .stateroom-deck-scroll::-webkit-scrollbar-track {
    background: transparent;
    margin-block: 7px;
  }
  .stateroom-modal-scroll::-webkit-scrollbar-thumb,
  .stateroom-deck-scroll::-webkit-scrollbar-thumb {
    background: rgba(100, 116, 139, 0.38);
    background-clip: padding-box;
    border: 1px solid transparent;
    border-radius: 999px;
  }
  .stateroom-modal-scroll::-webkit-scrollbar-thumb:hover,
  .stateroom-deck-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(71, 85, 105, 0.62);
    background-clip: padding-box;
  }
</style>

<script type="text/babel">
// MiniStep — proper +/- stepper control
function MiniStep({ value, min, onChange }) {
  const atMin = value <= min;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 2, border: `1px solid ${WF.line}`, borderRadius: 6, padding: 2, background: '#fff' }}>
      <button
        type="button"
        onClick={() => onChange(Math.max(min, value - 1))}
        disabled={atMin}
        style={{
          width: 20, height: 20, display: 'flex', alignItems: 'center', justifyContent: 'center',
          borderRadius: 4, border: 'none', background: 'transparent',
          cursor: atMin ? 'not-allowed' : 'pointer', fontSize: 13, fontWeight: 600,
          color: atMin ? WF.inkFaint : WF.inkSoft, fontFamily: 'inherit', lineHeight: 1,
        }}
      >−</button>
      <span style={{ fontSize: 12, fontWeight: 700, color: WF.ink, minWidth: 16, textAlign: 'center' }}>{value}</span>
      <button
        type="button"
        onClick={() => onChange(value + 1)}
        style={{
          width: 20, height: 20, display: 'flex', alignItems: 'center', justifyContent: 'center',
          borderRadius: 4, border: 'none', background: 'transparent',
          cursor: 'pointer', fontSize: 13, fontWeight: 600, color: WF.inkSoft, fontFamily: 'inherit', lineHeight: 1,
        }}
      >+</button>
    </div>
  );
}
window.MiniStep = MiniStep;
</script>

<!-- Step-3 control styles. Real CSS rather than the inline onMouseEnter /
     onMouseLeave pairs this screen used to carry: those repaint a border on
     hover and do nothing at all on keyboard focus, so a tab-driven agent had
     no visible focus anywhere on the screen. A stylesheet gets :hover and
     :focus-visible for the same code, and states live in one place instead of
     being restated at a dozen call sites. -->
<style>
  .s4-btn { font-family: inherit; cursor: pointer; transition: background-color .12s, border-color .12s, color .12s; }
  .s4-btn:focus-visible, .s4-x:focus-visible, .s4-supp-count:focus-visible { outline: 2px solid #1B2434; outline-offset: 2px; }

  /* Row-level action. Resting state is bare text on purpose: ten of these
     stacked down a guest list read as ten teal pills racing the names beside
     them for attention. The label stays fully legible at rest — this hides
     decoration, never the affordance — and the box arrives on hover/focus. */
  /* Colours here are the WF accent family by value — plain CSS can't read the
     JS tokens. accentInk #1B2434 (same navy as accentOn) / accentTint #EFF6FF
     / accentLine #DBEAFE. Keep them in step with wireframe-primitives.jsx. */
  .s4-edit { border: 1px solid transparent; background: transparent; color: #1B2434; }
  .s4-edit:hover { background: #EFF6FF; border-color: #DBEAFE; }

  .s4-ghost { border: 1px solid #E2E8F0; background: #fff; color: #1B2434; }
  .s4-ghost:hover { border-color: #1B2434; background: #EFF6FF; }

  .s4-primary { border: none; background: #1B2434; color: #fff; box-shadow: 0 1px 2px rgba(27,36,52,.28); }
  .s4-primary:hover:not(:disabled) { background: #2B3B50; }
  .s4-primary:disabled { background: #E2E8F0; color: #64748B; cursor: not-allowed; box-shadow: none; }

  .s4-secondary { border: 1px solid #CBD5E1; background: #fff; color: #0F172A; }
  .s4-secondary:hover { border-color: #94A3B8; background: #F8FAFC; }

  /* Discard is destructive and reversible only by redoing the booking, so it
     rests as plain text — present, but not competing with the two actions that
     move the booking forward. Red is held back until intent is shown. */
  .s4-quiet { border: 1px solid transparent; background: transparent; color: #475569; }
  .s4-quiet:hover { color: #B91C1C; background: #FEF2F2; }

  .s4-x { cursor: pointer; color: #475569; border-radius: 3px; }
  .s4-x:hover { color: #B91C1C; }

  .s4-supp-count { cursor: pointer; transition: background-color .12s, border-color .12s, box-shadow .12s; }
  .s4-supp-count:hover { background: #F8FAFC !important; border-color: #94A3B8 !important; }
  .s4-supp-count[aria-expanded="true"] { background: #EFF6FF !important; border-color: #1B2434 !important; box-shadow: 0 1px 2px rgba(15,23,42,.08); }

  .s4-promo-code:focus { outline: none; border-color: #1B2434 !important; box-shadow: 0 0 0 2px #DBEAFE; }
</style>

<script type="text/babel">

// ── Builds the real traveler roster for Step 4 from guests + ages (Step 2)
// and guest names (Step 3), mapping each traveler's supplements from the
// same suppAssignments map Step 2's "Assign supplements" flow writes to. ──
function s4BuildPassengers(guests, guestAges, guestData, suppAssignments, cabins, primaryGuestCode, primaryGuestConfigured) {
  const CATS = [
    { key: 'adults', code: 'A', type: 'Adult' },
    { key: 'youngAdults', code: 'YA', type: 'Young Adult' },
    { key: 'children', code: 'C', type: 'Child' },
    { key: 'infants', code: 'I', type: 'Infant' }
  ];
  const g = guests || {};
  const ages = guestAges || {};
  const gd = guestData || {};
  const assign = suppAssignments || {};
  // guestKey → cabin key, used only to group travellers under their room in
  // the review. Supplement quantities stay guest-scoped.
  const cabinOf = buildCabinGuestMap(g, cabins);
  const list = [];
  // Existing bookings keep the original first-eligible-traveller behaviour
  // until an agent explicitly uses the new control. Once configured, the code
  // is the single source of truth; null intentionally means no primary guest.
  const legacyPrimaryCode = (g.adults || 0) > 0 ? 'A1' : (g.youngAdults || 0) > 0 ? 'YA1' : null;
  const resolvedPrimaryCode = primaryGuestConfigured ? primaryGuestCode : legacyPrimaryCode;
  CATS.forEach(({ key, code, type }) => {
    const count = g[key] || 0;
    const ageArr = ages[key] || [];
    for (let i = 0; i < count; i++) {
      const guestKey = `${key}-${i}`;
      const passCode = `${code}${i + 1}`;
      // Prefer an explicit age if one was ever captured; otherwise fall back to
      // the band implied by the guest type, which is how ages are collected now.
      const rawAge = ageArr[i];
      const age = rawAge !== undefined && rawAge !== null && rawAge !== '' && !isNaN(parseInt(rawAge, 10)) ? parseInt(rawAge, 10) : null;
      const ageBand = GUEST_BANDS[key];
      const rec = gd[passCode];
      const supps = {};
      Object.entries(assign).forEach(([suppId, byGuest]) => {
        if (key !== 'infants' && byGuest && byGuest[guestKey] > 0) supps[suppId] = byGuest[guestKey];
      });
      const ck = cabinOf[guestKey];
      const canBePrimary = key === 'adults' || key === 'youngAdults';
      const isPrimary = canBePrimary && passCode === resolvedPrimaryCode;
      list.push({
        code: passCode,
        guestKey,
        // The cabin this traveller sits in, as a suppAssignments key. Needed so
        // a cabin-level chip can be removed from the review screen — the chip is
        // rendered per-occupant but the underlying entry is keyed by cabin.
        cabinKey: ck || null,
        name: rec && rec.name ? rec.name : `${type} ${i + 1}`,
        type,
        note: isPrimary ? 'Primary' : canBePrimary ? 'Companion' : 'Dependent',
        age,
        ageBand,
        isTemp: !!(rec && rec.name && rec.name.startsWith('Temp')),
        email: null,
        supps
      });
    }
  });
  return list;
}

// ── Step-progress bar (Step 4 variant — all prior steps clickable) ──
function S4StepProgress({ onBack }) {
  const steps = [
    { n: 1, label: 'Sailing, fare & cabin' },
    { n: 2, label: 'Add guests' },
    { n: 3, label: 'Review & confirm' }
  ];
  return (
    <div style={{ display: 'flex', alignItems: 'center', background: WF.panel, border: `1px solid ${WF.line}`, borderRadius: 8, padding: '6px 8px', marginBottom: 20 }}>
      {steps.map((st, i) => {
        const s = st.n < 3 ? 'done' : 'current';
        return (
          <React.Fragment key={st.n}>
            <button onClick={() => st.n < 3 && onBack(st.n)} style={{ display: 'flex', alignItems: 'center', gap: 8, border: 'none', padding: '6px 10px', borderRadius: 6, fontFamily: 'inherit', background: s === 'current' ? WF.fill : 'transparent', cursor: st.n < 3 ? 'pointer' : 'default' }}>
              {/* See step2-common.jsx — current gets the halo, done the bare fill. */}
              <div style={{ width: 18, height: 18, borderRadius: 9, flexShrink: 0, background: WF.accent, boxShadow: s === 'current' ? `0 0 0 3px ${WF.accentLine}` : 'none', color: '#fff', fontSize: 10, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{s === 'done' ? '✓' : 3}</div>
              <div style={{ fontSize: 12, fontWeight: s === 'current' ? 600 : 500, color: WF.ink, whiteSpace: 'nowrap' }}>{st.label}</div>
            </button>
            {i < steps.length - 1 && <div style={{ flex: 1, height: 1, minWidth: 8, background: st.n < 3 ? WF.accentOn : WF.line, opacity: st.n < 3 ? 0.4 : 1 }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ── Supplement teal accent + Manage Supplements modal ──
// Aliases of the shared accent family, not a palette of their own. These were
// a teal (#0F766E / #E6F4F1) that existed nowhere else in the design system,
// which is how this screen ended up running a different accent from the totals
// panel sitting inside it. Renamed from S4_TEAL/S4_TEAL_TINT — the old names
// would have gone stale the moment the value stopped being teal.
const S4_ACCENT = WF.accentInk;
const S4_ACCENT_TINT = WF.accentTint;

// ── Line-weight system for this screen ─────────────────────────────────────
// Now that the whole review sits on ONE bordered surface instead of three
// stacked cards, the card borders no longer do the dividing — so the rules
// inside have to. Two weights, two meanings:
//
//   1 · the container's own solid border  → "this is the surface"
//   2 · S4_RULE, solid, one shade darker → separates SECTIONS and the peer
//       groups inside them (snapshot ┊ guests ┊ summary, fare / add-ons / taxes)
//   3 · WF.line, solid hairline           → structure WITHIN a group (guest
//       rows, snapshot cells, cabin boxes)
//
// S4_RULE is darker than WF.line to create distinction without visual weight —
// it groups rather than subdivides. Solid throughout keeps the read clean.
const S4_RULE_COLOR = '#CBD5E1';
const S4_RULE = `1px solid ${S4_RULE_COLOR}`;

const S4_EMPTY_GUEST_DRAFT = { firstName: '', lastName: '', dob: '', phone: '', email: '', directoryId: null, isPrimary: false };

// `guestData` stores one `name` string (that is what Step 2 writes and what
// every reader renders), while the form edits first and last separately — so
// the split happens here, on the way in.
//
// A placeholder ("Temp Adult 1") comes back as two empty fields rather than
// being parsed into First="Temp" / Last="Adult 1": the agent opening this form
// is there to replace the placeholder, and pre-filling it with the fake name
// makes them clear two fields before they can type.
function s4SplitGuestName(name) {
  if (!name || /^Temp\b/.test(name)) return { firstName: '', lastName: '' };
  const parts = String(name).trim().split(/\s+/);
  return { firstName: parts[0] || '', lastName: parts.slice(1).join(' ') };
}

// ── One row of the guest-details form. Mirrors the field set Step 2's manual
// entry collects (first / last / dob / phone / email) rather than inventing a
// second, wider shape — both write the same `guestData[code]` record, so a name
// typed here is the same name Step 2 would have written. ──
function S4Field({ label, type, value, placeholder, onChange, span }) {
  return (
    <div style={span ? { gridColumn: '1 / -1' } : undefined}>
      <label style={{ display: 'block', fontSize: 11, fontWeight: 600, color: WF.inkSoft, marginBottom: 5 }}>{label}</label>
      <input
        type={type || 'text'}
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)}
        style={{
          width: '100%', padding: '9px 12px', fontSize: 13, border: `1px solid ${WF.line}`,
          borderRadius: 7, fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box',
          background: '#fff', color: type === 'date' && !value ? WF.inkFaint : WF.ink,
        }} />
    </div>
  );
}

// One modal, two scopes and — for a guest — two jobs.
//
// A guest row's Edit button used to lead only here, to supplements — so fixing a
// placeholder name meant walking back to Step 2, even though this screen is
// exactly where the placeholder gets noticed (the warning banner names it). The
// two jobs an agent has on a guest at review time are "who is this person" and
// "what are they carrying", so the modal now carries both as tabs. Guest details
// leads because a nameless traveller blocks ticketing while a missing spa pass
// does not.
function S4EditModal({ target, draftSupps, setDraftQty, draftGuest, setDraftGuestField, onPickDirectory, onSave, onCancel }) {
  const [search, setSearch] = React.useState('');
  const [cat, setCat] = React.useState(null);
  const [tab, setTab] = React.useState('Guest details');
  const onSupps = tab === 'Supplements';

  // Customer-index search. Local to the modal — a lookup the agent is doing, not
  // a value the booking stores. `pickedId` only drives the "✓ Added" affordance
  // and the divider caption; the profile's data is already in `draftGuest`, so
  // losing this on remount costs nothing.
  // Seeded from the record so a traveller already linked to a customer reopens
  // saying so, rather than claiming their details were typed by hand. Safe as an
  // initialiser because the modal is remounted per target (`key` at the call
  // site), so this re-reads for each guest instead of going stale.
  const [dirQuery, setDirQuery] = React.useState('');
  const [pickedId, setPickedId] = React.useState(draftGuest.directoryId || null);
  const dirResults = searchGuestDirectory(dirQuery, 6);

  const categories = ['All', ...new Set((S2_SUPP || []).map((s) => s.category))];
  const supps = (S2_SUPP || []).filter((su) => {
    if (cat && su.category !== cat) return false;
    if (search && !su.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const g = target.guest;
  const isInfant = !!(g && g.type === 'Infant');
  const canBePrimary = !!(g && (g.type === 'Adult' || g.type === 'Young Adult'));

  // How many of this guest's own items are already on, shown on the Supplements
  // tab label. Without it, switching tabs is the only way to find out whether
  // the tab you're not looking at has anything in it.
  const suppOnCount = isInfant ? 0 : Object.keys(draftSupps).filter((id) => draftSupps[id] > 0).length;
  const suppTabLabel = isInfant ? 'Supplements · Not eligible' : `Supplements${suppOnCount > 0 ? ` · ${suppOnCount}` : ''}`;

  return (
    <div onClick={onCancel} style={{ position: 'fixed', inset: 0, background: 'rgba(15,23,42,0.45)', zIndex: 100, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: '100%', maxWidth: 640, maxHeight: '86vh', background: '#fff', borderRadius: 14, display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 24px 60px rgba(15,23,42,0.28)' }}>

        {/* Header */}
        <div style={{ padding: '20px 24px 16px', borderBottom: `1px solid ${WF.line}`, background: '#F8FAFC' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 19, fontWeight: 800, color: WF.ink, letterSpacing: -0.3 }}>
                Edit {target.title}
              </div>
              <div style={{ fontSize: 13, color: WF.inkSoft, marginTop: 3 }}>
                Guest record and the supplements charged to them.
              </div>
            </div>
            <button onClick={onCancel} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 22, color: WF.inkSoft, lineHeight: 1, padding: 0, marginTop: 2 }}>×</button>
          </div>
        </div>

        {/* Tab strip. Same SPSegmented control the rails and Order summary use, so
            this is the one toggle idiom in the product rather than a third. It
            sits on white, not on the header's tint — the control's own track is
            WF.fill, which IS the header colour, so on the header the inactive
            half would have dissolved into the background. */}
        <div style={{ padding: '12px 24px', borderBottom: `1px solid ${WF.line}`, background: '#fff' }}>
          <div style={{ maxWidth: 340 }}>
            <SPSegmented
              options={['Guest details', suppTabLabel]}
              value={onSupps ? suppTabLabel : 'Guest details'}
              onChange={(v) => setTab(v.indexOf('Supplements') === 0 ? 'Supplements' : 'Guest details')} />
          </div>
        </div>

        {/* ── Guest details ── */}
        {!onSupps && (
          <div style={{ flex: 1, overflowY: 'auto', padding: '16px 24px 20px' }}>
            {/* Category and age remain read-only booking context. Primary status
                is now the one role decision available here, immediately below
                this context, because it belongs to the guest record being edited. */}
            {g && (
              <div style={{ marginBottom: 14, paddingBottom: 12, borderBottom: `1px solid ${WF.line}` }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 9.5, fontWeight: 700, color: WF.inkSoft, background: WF.fill, border: `1px solid ${WF.line}`, borderRadius: 4, padding: '2px 6px' }}>{g.code}</span>
                  <span style={{ fontSize: 11.5, color: WF.inkSoft }}>{g.type} · {g.age != null ? `Age ${g.age}` : g.ageBand}</span>
                  {g.isTemp && <span style={{ background: '#FEF3C7', color: '#92400E', padding: '1px 5px', borderRadius: 3, fontSize: 9, fontWeight: 700 }}>TEMP</span>}
                  <span style={{ fontSize: 10.5, color: WF.inkFaint, marginLeft: 'auto' }}>Age set on Sailing, fare &amp; cabin</span>
                </div>

                {canBePrimary && (
                  <button
                    type="button"
                    role="switch"
                    aria-checked={!!draftGuest.isPrimary}
                    onClick={() => setDraftGuestField('isPrimary', !draftGuest.isPrimary)}
                    className="s4-btn"
                    style={{
                      width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
                      marginTop: 10, padding: '9px 10px', borderRadius: 8, textAlign: 'left',
                      border: `1px solid ${draftGuest.isPrimary ? WF.accentLine : WF.line}`,
                      background: draftGuest.isPrimary ? WF.accentTint : WF.panel,
                      color: WF.ink
                    }}>
                    <span style={{ minWidth: 0 }}>
                      <span style={{ display: 'block', fontSize: 11.5, fontWeight: 700, color: WF.ink }}>Primary guest</span>
                      <span style={{ display: 'block', fontSize: 10, fontWeight: 500, color: WF.inkSoft, marginTop: 2 }}>Main contact and lead traveler for this booking.</span>
                    </span>
                    <span aria-hidden="true" style={{
                      width: 38, height: 22, borderRadius: 999, flexShrink: 0,
                      position: 'relative', background: draftGuest.isPrimary ? WF.accentInk : '#CBD5E1',
                      border: `1px solid ${draftGuest.isPrimary ? WF.accentInk : WF.controlLine}`,
                      boxSizing: 'border-box',
                      transition: 'background .15s'
                    }}>
                      <span style={{
                        position: 'absolute', top: 3, left: draftGuest.isPrimary ? 19 : 3,
                        width: 16, height: 16, borderRadius: 999, background: '#fff',
                        boxShadow: '0 1px 2px rgba(15,23,42,.22)', transition: 'left .15s'
                      }} />
                    </span>
                  </button>
                )}
              </div>
            )}

            {/* ── Customer index ──
                A returning traveller is already on file, so the first question
                on this tab is "have we met them" — retyping five fields you
                already hold is how a duplicate profile and a misspelled name get
                created. Picking a result FILLS the form rather than saving
                outright: the agent still gets to correct a stale phone number,
                and the one Save Changes below stays the only commit path, so
                this can't half-write a guest. */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, color: WF.inkLabel, textTransform: 'uppercase', marginBottom: 7 }}>Search customer index</div>
              <div style={{ position: 'relative' }}>
                <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: WF.inkFaint, fontSize: 14 }}>🔍</span>
                <input
                  type="text"
                  placeholder="Search by name, email, phone or customer ID…"
                  value={dirQuery}
                  onChange={(e) => setDirQuery(e.target.value)}
                  style={{ width: '100%', padding: '9px 12px 9px 36px', fontSize: 13, border: `1px solid ${WF.line}`, borderRadius: 7, fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
                {dirQuery && (
                  <button
                    onClick={() => setDirQuery('')}
                    title="Clear search"
                    style={{ position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', fontSize: 16, color: WF.inkFaint, lineHeight: 1, padding: 0 }}>×</button>
                )}
              </div>

              {dirQuery.trim().length > 0 && dirQuery.trim().length < 2 && (
                <div style={{ fontSize: 11, color: WF.inkFaint, marginTop: 6 }}>Type at least 2 characters to search.</div>
              )}

              {dirQuery.trim().length >= 2 && (
                dirResults.length > 0 ? (
                  <div style={{ marginTop: 8, border: `1px solid ${WF.line}`, borderRadius: 8, overflow: 'hidden', maxHeight: 188, overflowY: 'auto' }}>
                    {dirResults.map((p, i) => {
                      const picked = pickedId === p.id;
                      return (
                        <div
                          key={p.id}
                          onClick={() => { onPickDirectory(p); setPickedId(p.id); }}
                          style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 11px', cursor: 'pointer', background: picked ? S4_ACCENT_TINT : '#fff', borderTop: i === 0 ? 'none' : `1px solid ${WF.lineSoft}` }}
                          onMouseEnter={(e) => { if (!picked) e.currentTarget.style.background = WF.fill; }}
                          onMouseLeave={(e) => { if (!picked) e.currentTarget.style.background = '#fff'; }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                              <span style={{ fontSize: 12.5, fontWeight: 700, color: WF.ink }}>{directoryFullName(p)}</span>
                              {p.tier && (
                                <span style={{ fontSize: 8.5, fontWeight: 700, letterSpacing: 0.4, color: '#92400E', background: '#FEF3C7', borderRadius: 3, padding: '1px 5px' }}>{p.tier.toUpperCase()}</span>
                              )}
                              <span style={{ fontSize: 9.5, color: WF.inkFaint, fontFamily: 'ui-monospace, monospace' }}>{p.id}</span>
                            </div>
                            <div style={{ fontSize: 10.5, color: WF.inkSoft, marginTop: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                              {p.email} · {p.phone} · {p.city} · {p.bookings} past booking{p.bookings === 1 ? '' : 's'}
                            </div>
                          </div>
                          <span style={{ fontSize: 10.5, fontWeight: 700, color: picked ? S4_ACCENT : WF.inkSoft, flexShrink: 0 }}>
                            {picked ? '✓ Added' : 'Add'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{ fontSize: 11.5, color: WF.inkSoft, marginTop: 8, padding: '9px 11px', background: WF.fill, border: `1px solid ${WF.line}`, borderRadius: 7 }}>
                    No match in the customer index — enter their details below to create a new record.
                  </div>
                )
              )}
            </div>

            {/* The divider earns its keep once search exists: without it the form
                below reads as part of the result list rather than as the other
                way to get the same job done. */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
              <div style={{ flex: 1, height: 1, background: WF.lineSoft }} />
              <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5, color: WF.inkFaint, textTransform: 'uppercase' }}>
                {pickedId ? 'From customer index · editable' : 'Or enter manually'}
              </span>
              <div style={{ flex: 1, height: 1, background: WF.lineSoft }} />
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {/* Typing over the name breaks the customer link, not just the
                  caption: the identity is the name, so a hand-edited one must
                  not keep claiming to be CX-whatever. Contact fields don't do
                  this — correcting a stale phone number on a known customer is
                  the normal case, and it's still the same person. */}
              <S4Field label="First name" value={draftGuest.firstName} placeholder="e.g. Maria" onChange={(v) => { setPickedId(null); setDraftGuestField('directoryId', null); setDraftGuestField('firstName', v); }} />
              <S4Field label="Last name" value={draftGuest.lastName} placeholder="e.g. Alvarez" onChange={(v) => { setPickedId(null); setDraftGuestField('directoryId', null); setDraftGuestField('lastName', v); }} />
              <S4Field label="Date of birth" type="date" value={draftGuest.dob} onChange={(v) => setDraftGuestField('dob', v)} />
              <S4Field label="Phone number" type="tel" value={draftGuest.phone} placeholder="e.g. (555) 123-4567" onChange={(v) => setDraftGuestField('phone', v)} />
              <S4Field label="Email address" type="email" span value={draftGuest.email} placeholder="e.g. maria.alvarez@email.com" onChange={(v) => setDraftGuestField('email', v)} />
            </div>

            {/* Leaving both name fields empty is a legitimate way to change only
                the supplements on a still-unnamed traveller, so it doesn't block
                the save — it just keeps whatever name the record already had. */}
            {g && g.isTemp && !draftGuest.firstName && !draftGuest.lastName && (
              <div style={{ fontSize: 11, color: '#B45309', marginTop: 12 }}>
                This traveller keeps the placeholder name until a first or last name is entered.
              </div>
            )}
          </div>
        )}

        {onSupps && isInfant && (
          <div style={{ flex: 1, padding: '24px', display: 'flex', alignItems: 'flex-start', justifyContent: 'center' }}>
            <div style={{ width: '100%', padding: '14px 16px', border: `1px solid ${WF.line}`, borderRadius: 9, background: WF.fill }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: WF.ink }}>Supplements are not available for infants.</div>
              <div style={{ fontSize: 11.5, color: WF.inkSoft, marginTop: 4 }}>No supplement can be assigned or charged to this guest category.</div>
            </div>
          </div>
        )}

        {/* Search + category filters */}
        {onSupps && !isInfant && (
        <div style={{ padding: '16px 24px 12px', borderBottom: `1px solid ${WF.line}` }}>
          <div style={{ position: 'relative', marginBottom: 12 }}>
            <span style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', color: WF.inkFaint, fontSize: 15 }}>🔍</span>
            <input type="text" placeholder="Search supplements…" value={search} onChange={(e) => setSearch(e.target.value)} style={{ width: '100%', padding: '11px 14px 11px 42px', fontSize: 13, border: `1px solid ${WF.line}`, borderRadius: 8, fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
          </div>
          <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
            {categories.map((c) => {
              const on = (c === 'All' && cat === null) || cat === c;
              return (
                <button key={c} onClick={() => setCat(c === 'All' ? null : c)} style={{ padding: '6px 14px', fontSize: 12, fontWeight: on ? 700 : 500, border: 'none', borderRadius: 20, background: on ? '#1B2434' : '#EEF2F6', color: on ? '#fff' : WF.ink, cursor: 'pointer', fontFamily: 'inherit', transition: 'all 0.12s' }}>
                  {c}
                </button>
              );
            })}
          </div>
        </div>
        )}

        {/* Supplement list */}
        {onSupps && !isInfant && (
        <div style={{ flex: 1, overflowY: 'auto', padding: '14px 24px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {supps.length > 0 ? supps.map((su) => {
            const qty = draftSupps[su.id] || 0;
            const on = qty > 0;
            const lineTotal = su.pricePP * qty;
            return (
              <div key={su.id} style={{
                display: 'grid', gridTemplateColumns: 'minmax(0, 1fr) auto', alignItems: 'center', gap: 14,
                padding: '11px 12px', border: `1px solid ${on ? WF.accentLine : WF.line}`,
                borderRadius: 10, background: on ? WF.accentTint : '#fff',
                boxShadow: on ? `inset 3px 0 0 ${WF.accentInk}` : 'none',
                transition: 'border-color 0.12s, background 0.12s'
              }}>
                {/* Identity stays together: category explains the catalogue grouping,
                    while price remains supporting information rather than competing
                    with the product name. */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 11, minWidth: 0 }}>
                  <span aria-hidden="true" style={{
                    width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    flexShrink: 0, fontSize: 20, borderRadius: 8, background: '#fff', border: `1px solid ${WF.line}`
                  }}>{su.emoji}</span>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 10.5, fontWeight: 700, color: WF.inkLabel, letterSpacing: 0.55, textTransform: 'uppercase' }}>{su.category}</span>
                      {su.minAge && <span style={{ fontSize: 10.5, fontWeight: 700, color: '#92400E', background: '#FEF3C7', borderRadius: 4, padding: '1px 5px' }}>{su.minAge}+</span>}
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 750, color: WF.ink, lineHeight: 1.25, marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis' }}>{su.name}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap', marginTop: 3 }}>
                      <span style={{ fontSize: 11.5, color: WF.inkSoft }}>${su.pricePP.toFixed(2)} per guest</span>
                      {on && (
                        <span style={{ fontSize: 10.5, fontWeight: 700, color: WF.accentInk, background: '#fff', border: `1px solid ${WF.accentLine}`, borderRadius: 999, padding: '1px 6px' }}>✓ Assigned</span>
                      )}
                    </div>
                  </div>
                </div>

                {/* A stable two-column action block makes every row comparable.
                    Zero-value lines say what they mean instead of promoting +$0.00. */}
                <div style={{ display: 'grid', gridTemplateColumns: '78px 96px', alignItems: 'end', gap: 10, flexShrink: 0 }}>
                  <div style={{ minWidth: 0, textAlign: 'right' }}>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: WF.inkLabel, letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 4 }}>{on ? 'Line total' : 'Status'}</div>
                    <div style={{ fontSize: on ? 13 : 11.5, fontWeight: 700, color: on ? WF.ink : WF.inkSoft, fontFamily: on ? 'ui-monospace, monospace' : 'inherit', whiteSpace: 'nowrap' }}>
                      {on ? `+$${lineTotal.toFixed(2)}` : 'Not assigned'}
                    </div>
                  </div>
                  <div>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: WF.inkLabel, letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 4 }}>Quantity</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '32px 32px 32px', alignItems: 'center' }}>
                      <button
                        type="button"
                        aria-label={`Decrease ${su.name} quantity`}
                        title={`Decrease ${su.name} quantity`}
                        onClick={() => setDraftQty(su.id, qty - 1)}
                        disabled={qty === 0}
                        style={{ width: 32, height: 32, border: `1px solid ${WF.controlLine}`, borderRadius: '6px 0 0 6px', background: qty === 0 ? WF.fill : '#fff', color: qty === 0 ? WF.inkFaint : WF.ink, cursor: qty === 0 ? 'default' : 'pointer', fontFamily: 'inherit', fontSize: 17, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }}>−</button>
                      <div aria-live="polite" aria-label={`${su.name} quantity ${qty}`} style={{ width: 32, height: 32, borderTop: `1px solid ${WF.controlLine}`, borderBottom: `1px solid ${WF.controlLine}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 750, color: WF.ink, background: '#fff', boxSizing: 'border-box' }}>{qty}</div>
                      <button
                        type="button"
                        aria-label={`Increase ${su.name} quantity`}
                        title={`Increase ${su.name} quantity`}
                        onClick={() => setDraftQty(su.id, qty + 1)}
                        style={{ width: 32, height: 32, border: `1px solid ${WF.controlLine}`, borderRadius: '0 6px 6px 0', background: '#fff', color: WF.ink, cursor: 'pointer', fontFamily: 'inherit', fontSize: 17, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 1 }}>+</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }) : (
            <div style={{ fontSize: 13, color: WF.inkFaint, textAlign: 'center', padding: '24px 0' }}>No supplements match your search.</div>
          )}
        </div>
        )}

        {/* Footer. One Save for both tabs: the two drafts are edits to one
            traveller, so committing them separately would let an agent save a
            name and silently lose a supplement change made a moment earlier on
            the other tab. */}
        <div style={{ padding: '14px 24px', borderTop: `1px solid ${WF.line}`, display: 'flex', justifyContent: 'flex-end', gap: 10, background: '#fff' }}>
          <button onClick={onCancel} style={{ padding: '10px 22px', fontSize: 13, fontWeight: 600, border: `1px solid ${WF.line}`, borderRadius: 8, background: '#fff', color: WF.ink, cursor: 'pointer', fontFamily: 'inherit' }}>Cancel</button>
          <button onClick={onSave} style={{ padding: '10px 22px', fontSize: 13, fontWeight: 700, border: 'none', borderRadius: 8, background: WF.accentOn, color: '#fff', cursor: 'pointer', fontFamily: 'inherit' }}>Save Changes</button>
        </div>
      </div>
    </div>
  );
}

// ── One section inside the unified review surface. Borderless and unpadded on
// purpose: the screen has exactly one bordered surface now (the container), and
// re-boxing every section inside it stacked three levels of rounded rectangle —
// container ▸ card ▸ cabin group ▸ package panel — which is what made the old
// layout read as clutter rather than as a document. The zone's own dotted rule
// and this label carry the separation instead.
//
// No `icon`: the two section labels used to open with 👥 and 💵, which added a
// colour and a shape to a line whose whole job was to be a quiet signpost, and
// gave two sections a visual prominence the other two (snapshot, decisions)
// never had. An uppercase label alone is the consistent treatment.
//
// The label sits on `alignItems: 'baseline'` with its `meta` so a count or a
// subtotal on the right sits on the same typographic line as the title, not
// centred against its box. ──
function S4Section({ title, meta, children }) {
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10, marginBottom: 10 }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: WF.inkLabel, textTransform: 'uppercase' }}>{title}</div>
        {meta && <div style={{ fontSize: 11, fontWeight: 500, color: WF.inkSoft }}>{meta}</div>}
      </div>
      {children}
    </div>
  );
}

// ── One decision inside the Checkout options card. Deliberately borderless:
// it already sits inside a bordered card, and boxing each one again turned a
// short checklist into four competing panels. The micro-label carries the
// separation instead. ──
function S4Option({ label, divider, children, style = {} }) {
  return (
    <div style={{ ...(divider ? { paddingTop: 12, borderTop: S4_RULE } : {}), ...style }}>
      <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.5, color: WF.inkLabel, textTransform: 'uppercase', marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}

// ── A denser stand-in for summary-panel.jsx's SPPriceRow, scoped to this
// screen only. SPPriceRow is shared with the step 1/2 rail, so tightening it
// there would change screens nobody asked to change; this gives Order
// summary its own density without touching that shared component. ──
// Amounts are never `WF.inkFaint`. It measures 2.56:1 against this card's
// white — under half WCAG AA's 4.5:1 floor — and it was being used for the
// sub-amounts, which made the itemised figures an agent is here to check the
// least legible text on the page. `WF.inkSoft` is 7.58:1 and still reads as
// subordinate to the bold `WF.ink` subtotal beside it: the hierarchy was
// always carried by weight and size, so nothing is lost by fixing the colour.
function S4Row({ label, sub, amount, accent, strong }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10, padding: '2.5px 0' }}>
      <div style={{ fontSize: strong ? 12.5 : 12, fontWeight: strong ? 700 : 500, color: strong ? WF.ink : WF.inkSoft, minWidth: 0 }}>
        {label}
        {sub && <div style={{ fontSize: 10.5, color: WF.inkSoft, marginTop: 1 }}>{sub}</div>}
      </div>
      <span style={{ fontSize: strong ? 13 : 12, fontWeight: strong ? 700 : 500, color: accent || (strong ? WF.ink : WF.inkSoft), fontFamily: 'ui-monospace, monospace', fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{spMoney(amount)}</span>
    </div>
  );
}

// ── Booking-level receipt. One bordered surface holds the full calculation;
// charge families are sections within it, not four unrelated floating cards.
// Every amount shares one right edge and subordinate rows sit under a quiet
// divider, making the arithmetic easy to verify at receipt width. ──
function S4PriceDetail({ label, amount }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10, padding: '2px 0' }}>
      <span style={{ fontSize: 10.5, fontWeight: 500, color: WF.inkSoft, minWidth: 0 }}>{label}</span>
      <span style={{ fontSize: 10.5, fontWeight: 700, color: WF.inkSoft, fontFamily: 'ui-monospace, monospace', fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{spMoney(amount)}</span>
    </div>
  );
}

function S4PriceGroup({ label, amount, caption, first, children }) {
  return (
    <div style={{ padding: '10px 11px', borderTop: first ? 'none' : `1px solid ${WF.line}` }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: WF.ink, lineHeight: 1.25 }}>{label}</div>
          {caption && <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'wrap', marginTop: 3, fontSize: 9.5, fontWeight: 500, color: WF.inkSoft, lineHeight: 1.25 }}>{caption}</div>}
        </div>
        <span style={{ fontSize: 13, fontWeight: 800, color: WF.ink, fontFamily: 'ui-monospace, monospace', fontVariantNumeric: 'tabular-nums', flexShrink: 0, lineHeight: 1.2 }}>{spMoney(amount)}</span>
      </div>
      {children && (
        <div style={{ marginTop: 8, paddingTop: 6, borderTop: `1px solid ${WF.lineSoft}` }}>
          {children}
        </div>
      )}
    </div>
  );
}

function S4GlobalPriceBreakdown({ q, totalGuests, addOnsTotal, govtTaxes, cruiseFees, promotion }) {
  const noPromotion = promotion === 'None';
  const promotionCaption = noPromotion ? (
    <span>No promotion applied</span>
  ) : (
    <React.Fragment>
      <span style={{
        padding: '2px 5px', borderRadius: 4, background: WF.fill,
        border: `1px solid ${WF.line}`, color: WF.inkSoft,
        fontSize: 8.5, fontWeight: 800, fontFamily: 'ui-monospace, monospace'
      }}>{promotion}</span>

}

// ── Compact supplement disclosure. A count has a stable footprint even when a
// guest has many assignments; the full list stays available on hover and focus.
// The tooltip is portalled to <body> so cabin cards cannot clip it. ──
function S4SupplementCount({ guest, suppIds }) {
  const [tip, setTip] = React.useState(null);
  const triggerRef = React.useRef(null);
  const items = suppIds.map((id) => {
    const supplement = (S2_SUPP || []).find((s) => s.id === id);
    return supplement ? { id, name: supplement.name, qty: guest.supps[id] } : null;
  }).filter(Boolean);
  const tooltipId = `s4-supp-tooltip-${String(guest.guestKey || guest.code).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
  const accessibleList = items.map((item) => `${item.name}${item.qty > 1 ? `, quantity ${item.qty}` : ''}`).join('; ');

  const showTip = () => {
    if (!triggerRef.current) return;
    const rect = triggerRef.current.getBoundingClientRect();
    const width = 264;
    const estimatedHeight = Math.min(280, 54 + items.length * 30);
    const fitsBelow = rect.bottom + 8 + estimatedHeight <= window.innerHeight - 8;
    setTip({
      left: Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)),
      top: fitsBelow ? rect.bottom + 8 : Math.max(8, rect.top - estimatedHeight - 8),
      width
    });
  };
  const hideTip = () => setTip(null);

  React.useEffect(() => {
    if (!tip) return undefined;
    const dismiss = () => setTip(null);
    window.addEventListener('resize', dismiss);
    window.addEventListener('scroll', dismiss, true);
    return () => {
      window.removeEventListener('resize', dismiss);
      window.removeEventListener('scroll', dismiss, true);
    };
  }, [tip]);

  return (
    <React.Fragment>
      <button
        ref={triggerRef}
        type="button"
        className="s4-supp-count"
        aria-label={`${items.length} supplement${items.length === 1 ? '' : 's'} assigned to ${guest.name}: ${accessibleList}`}
        aria-describedby={tip ? tooltipId : undefined}
        aria-expanded={!!tip}
        onMouseEnter={showTip}
        onMouseLeave={hideTip}
        onFocus={showTip}
        onBlur={hideTip}
        onClick={showTip}
        style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 5,
          height: 24, padding: '0 7px 0 5px', borderRadius: 6,
          border: `1px solid ${WF.line}`, background: WF.panel,
          color: WF.inkSoft, fontSize: 10, fontWeight: 700,
          fontFamily: 'inherit', lineHeight: 1, whiteSpace: 'nowrap'
        }}>
        <span aria-hidden="true" style={{
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          minWidth: 16, height: 16, padding: '0 4px', boxSizing: 'border-box',
          borderRadius: 999, background: WF.accentInk, color: '#fff',
          fontSize: 9, fontWeight: 800, fontFamily: 'ui-monospace, monospace',
          fontVariantNumeric: 'tabular-nums'
        }}>{items.length}</span>
        <span aria-hidden="true">assigned</span>
        <svg
          aria-hidden="true"
          width="12"
          height="12"
          viewBox="0 0 14 14"
          fill="none"
          style={{
            display: 'block', flexShrink: 0, color: tip ? WF.ink : WF.inkFaint,
            transform: tip ? 'rotate(180deg)' : 'rotate(0deg)',
            transformOrigin: 'center', transition: 'transform .14s ease, color .12s ease',
          }}>
          <path d="M3.5 5.25 7 8.75l3.5-3.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      {tip && ReactDOM.createPortal(
        <div
          id={tooltipId}
          role="tooltip"
          style={{
            position: 'fixed', zIndex: 140, left: tip.left, top: tip.top, width: tip.width,
            maxHeight: 280, overflowY: 'auto', boxSizing: 'border-box', pointerEvents: 'none',
            padding: '10px 12px', borderRadius: 8, border: `1px solid ${WF.line}`,
            background: WF.panel, boxShadow: '0 8px 24px rgba(15,23,42,.16)', color: WF.ink
          }}>
          <div style={{
            fontSize: 9, fontWeight: 700, letterSpacing: 0.5,
            textTransform: 'uppercase', color: WF.inkLabel, marginBottom: 6
          }}>
            {items.length} supplement{items.length === 1 ? '' : 's'} assigned
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {items.map((item) => (
              <div key={item.id} style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10 }}>
                <span style={{ fontSize: 11.5, fontWeight: 600, color: WF.ink, lineHeight: 1.35 }}>{item.name}</span>
                {item.qty > 1 && (
                  <span style={{ fontSize: 10.5, fontWeight: 700, color: WF.inkSoft, fontFamily: 'ui-monospace, monospace', flexShrink: 0 }}>×{item.qty}</span>
                )}
              </div>
            ))}
          </div>
          <div style={{ fontSize: 9.5, color: WF.inkFaint, marginTop: 8, paddingTop: 7, borderTop: `1px solid ${WF.lineSoft}` }}>
            Use Edit to manage assignments.
          </div>
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}
