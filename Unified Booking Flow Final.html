// ── Step 4 App ──
function Step4App({ booking, update }) {
  // Bound to the router's booking — no local copy, no storage writes, no
  // hardcoded fallback booking. `setSt` keeps the functional-updater shape the
  // call sites below already use.
  const st = booking;
  const setSt = update;

  // Manage-supplements modal state. Supplements are assigned only to guests;
  // the retired once-per-cabin scope is stripped during booking normalization.
  const [manageTarget, setManageTarget] = React.useState(null);
  const [draftSupps, setDraftSupps] = React.useState({});
  // The guest-details half of the same modal. Separate draft from `draftSupps`
  // because the two write to different slices of the booking (`guestData` vs
  // `suppAssignments`), but both commit on one Save.
  const [draftGuest, setDraftGuest] = React.useState(S4_EMPTY_GUEST_DRAFT);
  const [showHoldMenu, setShowHoldMenu] = React.useState(false);

  // Which lens Order summary shows: the whole-booking ledger, or the same money
  // re-cut per stateroom. Local state — a view of the receipt, not booking data.
  // Same two labels and same segmented control as the Step 1 rail, so the toggle
  // is recognised as the one pattern rather than learned twice.
  const [summaryView, setSummaryView] = React.useState('Global Details');
  // The right rail is one commercial workspace. Order Summary is the default
  // decision view; Price Breakdown is an alternate verification view within
  // the same card. The nested Global/Cabin-wise switch remains pricing-only.
  const [commercialView, setCommercialView] = React.useState('Order Summary');

  // Derive the real passenger roster from guests + ages (Step 2) and guest
  // names (Step 3) — never a static mock — and map each traveler's
  // supplements from the same suppAssignments map Step 2 writes to.
  const passengers = s4BuildPassengers(
    st.guests, st.guestAges, st.guestData, st.suppAssignments, st.cabins,
    st.primaryGuestCode, st.primaryGuestConfigured
  );

  // Group guests by room for review context. The room header is informational;
  // supplements remain attached to individual guest rows.
  const cabinGroups = [];
  const cabinGroupByKey = {};
  const soloPassengers = [];
  passengers.forEach((p) => {
    if (!p.cabinKey) { soloPassengers.push(p); return; }
    if (!cabinGroupByKey[p.cabinKey]) {
      const cab = (st.cabins || []).find((c) => cabinSuppKey(c.id) === p.cabinKey);
      const group = {
        cabinKey: p.cabinKey,
        label: cab && cab.num ? `Room ${cab.num}` : 'Cabin',
        // Same helper the cabin-wise receipt uses, so "what category is this
        // room" reads identically whether the agent is looking at the guest
        // list or the money — one derivation, not two screens agreeing by luck.
        categoryName: cab ? cabinCategoryName(cab) : null,
        people: [],
      };
      cabinGroupByKey[p.cabinKey] = group;
      cabinGroups.push(group);
    }
    cabinGroupByKey[p.cabinKey].people.push(p);
  });

  // Seed a guest's supplement draft straight from the assignment map.
  const draftForKey = (key) => {
    const out = {};
    Object.entries(st.suppAssignments || {}).forEach(([sid, byKey]) => {
      if (byKey && byKey[key] > 0) out[sid] = byKey[key];
    });
    return out;
  };
  const openManage = (target) => {
    setManageTarget(target);
    setDraftSupps(target.guest && target.guest.type === 'Infant' ? {} : draftForKey(target.key));
    // Seeded from the live record, so reopening shows what was saved rather
    // than the previous guest's draft.
    const rec = target.code ? (st.guestData || {})[target.code] || {} : {};
    setDraftGuest({
      ...S4_EMPTY_GUEST_DRAFT,
      ...s4SplitGuestName(rec.name),
      dob: rec.dob || '', phone: rec.phone || '', email: rec.email || '',
      directoryId: rec.directoryId || null,
      isPrimary: !!(target.guest && target.guest.note === 'Primary'),
    });
  };
  const setDraftGuestField = (field, value) => setDraftGuest((prev) => ({ ...prev, [field]: value }));
  // Copies a customer-index profile into the draft — every field, replacing what
  // was there. A half-applied profile (name from the directory, phone left over
  // from a placeholder) is the exact duplicate-record mess the search exists to
  // prevent, so this deliberately overwrites rather than merges. `directoryId`
  // rides along so the saved record remembers which customer it came from.
  const applyDirectoryPerson = (p) => setDraftGuest((prev) => ({
    firstName: p.firstName || '', lastName: p.lastName || '',
    dob: p.dob || '', phone: p.phone || '', email: p.email || '',
    directoryId: p.id || null, isPrimary: prev.isPrimary,
  }));
  const setDraftQty = (suppId, qty) => {
    if (manageTarget && manageTarget.guest && manageTarget.guest.type === 'Infant') return;
    setDraftSupps((prev) => {
      const next = { ...prev };
      if (qty <= 0) delete next[suppId]; else next[suppId] = qty;
      return next;
    });
  };
  const saveManage = () => {
    const { key: assignKey, code } = manageTarget;
    const wasPrimary = !!(manageTarget.guest && manageTarget.guest.note === 'Primary');
    const primaryTouched = !!draftGuest.isPrimary !== wasPrimary;
    setSt((s) => {
      const suppAssignments = {};
      Object.entries(s.suppAssignments || {}).forEach(([sid, byKey]) => {
        suppAssignments[sid] = Object.fromEntries(
          Object.entries(byKey || {}).filter(([key, qty]) => !isCabinSuppKey(key) && !key.startsWith('infants-') && qty > 0)
        );
      });
      // Clear this guest's own entry everywhere, then re-add the draft.
      Object.keys(suppAssignments).forEach((sid) => { delete suppAssignments[sid][assignKey]; });
      Object.entries(draftSupps).forEach(([sid, qty]) => {
        if (!(qty > 0) || assignKey.startsWith('infants-')) return;
        const byKey = suppAssignments[sid] || {};
        byKey[assignKey] = qty;
        suppAssignments[sid] = byKey;
      });
      const selectedSupps = {};
      Object.keys(suppAssignments).forEach((sid) => {
        const total = Object.values(suppAssignments[sid]).reduce((a, b) => a + b, 0);
        if (total > 0) selectedSupps[sid] = total; else delete suppAssignments[sid];
      });

      // The guest-details half. Writes the same `guestData[code]` record shape
      // Step 2 writes — `{ confirmed, name, dob, phone, email }` — so a name
      // entered here is indistinguishable from one entered there, and walking
      // back to Step 2 shows this guest as confirmed rather than blank.
      //
      // Merged onto the existing record, and an empty name leaves the stored one
      // alone: opening this modal only to add a supplement must not wipe the
      // traveller's name as a side effect.
      let guestData = s.guestData;
      if (code) {
        const typed = [draftGuest.firstName, draftGuest.lastName].filter(Boolean).join(' ').trim();
        const prev = (s.guestData || {})[code] || null;
        const touched = !!(typed || draftGuest.dob || draftGuest.phone || draftGuest.email);
        // Only materialise a record when the form actually holds something, or
        // one already exists to merge into. A traveller can reach this modal
        // with no record at all (nobody has named them yet); if such an agent
        // only bumps a supplement and saves, writing an empty record would tell
        // Step 2 the guest is done — its "fill remaining as temp" count and its
        // continue gate both key off the record merely existing.
        if (touched || prev) {
          const next = { ...(prev || {}), dob: draftGuest.dob, phone: draftGuest.phone, email: draftGuest.email };
          if (typed) next.name = typed;
          // Which customer this traveller resolves to, when they came from the
          // index. Assigned OR deleted — never merely skipped: `next` spreads
          // `prev`, so leaving it alone would keep a link the agent just broke by
          // retyping the name, and the record would go on claiming to be a
          // customer it no longer matches.
          if (draftGuest.directoryId) next.directoryId = draftGuest.directoryId;
          else delete next.directoryId;
          // `confirmed` means "someone stands behind this record", which a
          // nameless one cannot claim — so it follows the name, not the save.
          if (next.name) next.confirmed = true;
          guestData = { ...(s.guestData || {}), [code]: next };
        }
      }

      // A single booking-level code enforces one lead traveler. Turning this
      // switch on automatically replaces the former primary; turning it off
      // intentionally leaves the booking without one so the review warning can
      // make that incomplete state explicit instead of silently reassigning it.
      const primaryGuestConfigured = primaryTouched ? true : !!s.primaryGuestConfigured;
      const primaryGuestCode = primaryTouched
        ? (draftGuest.isPrimary ? code : null)
        : (s.primaryGuestCode || null);

      return { ...s, suppAssignments, selectedSupps, guestData, primaryGuestConfigured, primaryGuestCode };
    });
    setManageTarget(null);
  };
  const discard = () => {
    if (!window.confirm('Discard this booking and start over?')) return;
    setSt({ ...BOOKING_DEFAULTS, step: 1 }, { replace: true });
  };

  // One pricing source, shared with the rail and every other step. Replaces the
  // divergent copy that hardcoded a 25% deposit (ignoring fc.deposit) and
  // invented a $577 fare when nothing was selected.
  const q = computeBookingPricing(st);
  const sailing = q.sailing;
  const g = st.guests || { adults: 0, youngAdults: 0, children: 0, infants: 0 };
  const totalGuests = q.guestCount;
  const cabin = q.cabin;
  const fc = q.fc;
  const cabinLabel = cabin ? `${cabin.name} · ${cabin.id}` : '—';
  // Order summary groups add-ons (things an agent can add/remove) apart from
  // taxes & port fees (fixed, non-editable) — two different questions ("what
  // did we choose" vs "what does the cruise line/government require") that
  // used to sit as undifferentiated rows in one flat list. The line previously
  // labelled "Gratuities" is the only fixed-charge figure the pricing model
  // produces, so it becomes the taxes/fees total here rather than inventing a
  // second charge on top of it; the government/cruise-line split below is an
  // illustrative allocation of that one figure, not a new cost.
  const round2 = (n) => Math.round(n * 100) / 100;
  const addOnsTotal = round2(q.suppTotal + q.protectionTotal);
  const govtTaxes = round2(q.gratuities * 0.6);
  const cruiseFees = round2(q.gratuities - govtTaxes);
  const fcLabel = fc ? fc.code : '—';

  // Cabin-wise lens. Comes from the same spCabinBreakdown the Step 1 rail uses,
  // so the two views of a room can't disagree — and because it allocates
  // `q.cabinFarePP`, the supplement assignments and `q.gratuities`, the room
  // subtotals re-add to exactly the fare + add-ons + taxes rows in the global
  // lens above rather than being a parallel calculation.
  //
  // Two things it deliberately does NOT allocate: trip protection and the
  // promo discount. Both are booking-wide — protection prices per guest with no
  // room dimension, and the coupon comes off the fare as one figure — so
  // splitting them across rooms would invent a per-room number the pricing model
  // never produces. They're stated once below the rooms instead, which is what
  // keeps this column adding up to the same Booking total as the global lens.
  const cw = summaryView === 'Cabin-wise Details' && q.status !== 'empty' ? spCabinBreakdown(st, q) : null;
  const roomsSubtotal = cw
    ? round2(cw.rooms.reduce((t, rm) => t + rm.subtotal, 0) + (cw.unassigned ? cw.unassigned.suppTotal : 0))
    : 0;

  const handleBack = (stepNum) => {
    window.__bookingNavigate(stepNum);
  };

  // Restated under the guest list so the supplements number the agent just
  // eyeballed per-person matches the one in the order summary below.
  const suppCount = (q.suppLines || []).filter((ln) => !ln.inPkg).length;

  return (
    <WFAppShell
      activeGroup="bookings"
      active="create-booking"
      breadcrumb={['CRM', 'Bookings', 'Create', 'Review & confirm']}
      progressBar={<S4StepProgress onBack={handleBack} />}>

      {/* No right rail on this step. The rail's recap duplicated what the cards
          below already say, and its own default was to sit collapsed here — the
          only part worth keeping was the always-visible total, which is now the
          sticky bar at the bottom of this scrollport. */}
      <div data-screen-label="Step 3 · Review & Confirm">

        {/* One capped, centred container for the whole screen — heading included.
            Past ~1140px nothing gains from being wider: it would only drag a
            guest's name and their Add/Edit button apart. The heading used to sit
            outside this cap and run full-width, so the page had two different
            measures stacked on each other; and without `margin: 0 auto` the
            block hugged the left edge, leaving the whole surplus as one void on
            the right. Now the surplus is symmetric gutters. */}
        <div style={{ maxWidth: 1140, margin: '0 auto' }}>
          <div style={{ fontWeight: 700, color: WF.ink, letterSpacing: -0.3, marginBottom: 4, fontSize: 24 }}>Review &amp; confirm</div>
          <div style={{ fontSize: 13, color: WF.inkSoft, marginBottom: 20 }}>Verify every line below matches what the guest agreed to, then confirm.</div>

          {/* Two review surfaces: the booking record on the left and its
              commercial summary on the right. Snapshot and guests belong to
              one booking record, while Order summary is an independently
              actionable receipt. The shared grid keeps both cards aligned
              without implying that they are one continuous container. */}
          <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.55fr) minmax(320px, 1fr)', gap: 16, alignItems: 'start' }}>

          {/* ── Booking record: snapshot and guests. ── */}
          <div style={{ background: WF.panel, border: `1px solid ${WF.line}`, borderRadius: 12, overflow: 'hidden', minWidth: 0 }}>

            {/* ── Booking snapshot. Full width, because it describes the whole
                    booking rather than the guest column below it — a two-column
                    split at this level would have squeezed four facts into the
                    narrower measure meant for a receipt. Four facts, not three:
                    Departs and Arrival are now separate columns rather than one
                    combined "date → port" string, so each date gets its own
                    label instead of sharing a line that answered two questions
                    at once. Source is included as the fifth fact so the booking's
                    acquisition context is visible during final verification.
                    Cabin stays dropped — room assignment already lives
                    on each cabin group's own header in Guest details, right next
                    to the guests in it. Ports are dummy ("Port Tampa Bay" for
                    both legs) pending a real embark/disembark-port field on the
                    sailing model. ── */}
            <div style={{ padding: '13px 20px 14px' }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.6, color: WF.inkLabel, textTransform: 'uppercase', marginBottom: 10 }}>Booking snapshot</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0, 1fr))' }}>
                {[
                  { label: 'Destination', value: sailing ? `${sailing.region} · ${sailing.nights}N` : '—', sub: sailing ? sailing.ship : '—' },
                  { label: 'Departs', value: sailing ? sailing.depart : '—', sub: 'Port Tampa Bay' },
                  { label: 'Arrival', value: sailing ? sailing.ret : '—', sub: 'Port Tampa Bay' },
                  { label: 'Farecode', value: fc ? (fc.refundable ? 'Refundable' : 'Non-refundable') : '—', sub: fcLabel },
                  { label: 'Source', value: st.source || '—', sub: 'Booking source' },
                ].map((f, i) => (
                  <div key={f.label} style={{ padding: i === 0 ? '0 16px 0 0' : '0 16px', borderLeft: i === 0 ? 'none' : `1px solid ${WF.line}`, minWidth: 0 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: WF.inkLabel, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 3 }}>{f.label}</div>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: WF.ink, lineHeight: 1.25, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.value}</div>
                    <div style={{ fontSize: 10.5, color: WF.inkSoft, marginTop: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.sub}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* ── Guest details continue inside the booking-record card. ── */}
            <div style={{ borderTop: S4_RULE }}>

              {/* ═══ Guests, and what each of them is carrying. Supplements stay
                      attached to the person who ordered them rather than being
                      flattened into a product list — verifying "did we put the
                      spa pass on the right guest" is the actual task here. ═══ */}
              <div style={{ padding: '15px 20px 18px', minWidth: 0 }}>
            <S4Section
              title="Guest details"
              meta={`${g.adults} Adults${g.youngAdults ? ` · ${g.youngAdults} Young Adults` : ''} · ${g.children} Children${g.infants ? ` · ${g.infants} Infants` : ''}`}>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {cabinGroups.map((group) => {
                  return (
                    <div key={group.cabinKey} style={{
                      border: `1px solid ${WF.line}`, borderRadius: 10, overflow: 'hidden',
                      boxShadow: '0 1px 2px rgba(15,23,42,0.06)'
                    }}>
                      {/* Room context only. Supplement assignment is deliberately
                          absent here because the product now supports guest-level
                          allotment exclusively. */}
                      <div style={{
                        display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
                        padding: '10px 12px', background: WF.fill, borderBottom: `1px solid ${WF.line}`
                      }}>
                        <div style={{ minWidth: 0 }}>
                          <div style={{
                            fontSize: 12.5, fontWeight: 700, color: WF.ink,
                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'
                          }}>
                            {group.label}
                          </div>
                          {group.categoryName && (
                            <div style={{ fontSize: 10.5, fontWeight: 500, color: WF.inkSoft, marginTop: 2 }}>
                              {group.categoryName}
                            </div>
                          )}
                        </div>
                        <span style={{
                          padding: '4px 8px', borderRadius: 999, border: `1px solid ${WF.line}`,
                          background: WF.panel, color: WF.inkSoft, fontSize: 10, fontWeight: 700,
                          whiteSpace: 'nowrap', flexShrink: 0
                        }}>
                          {group.people.length} guest{group.people.length === 1 ? '' : 's'}
                        </span>
                      </div>
                      <div>
                        {group.people.map((guest, i) => (
                          <S4GuestRow key={guest.guestKey} guest={guest} last={i === group.people.length - 1} onOpenManage={() => openManage({ kind: 'guest', key: guest.guestKey, title: `${guest.name} (${guest.code})`, code: guest.code, guest })} />
                        ))}
                      </div>
                    </div>
                  );
                })}
                {/* No box here on purpose: a cabin group's border+header earns its
                    weight by holding cabin-level info a solo guest doesn't have.
                    Boxing an unassigned guest identically made two different
                    things look like the same thing sitting flush together. */}
                {soloPassengers.length > 0 && (
                  <div style={{ paddingTop: cabinGroups.length > 0 ? 2 : 0 }}>
                    {soloPassengers.map((guest, i) => (
                      <S4GuestRow key={guest.guestKey} guest={guest} last={i === soloPassengers.length - 1} onOpenManage={() => openManage({ kind: 'guest', key: guest.guestKey, title: `${guest.name} (${guest.code})`, code: guest.code, guest })} />
                    ))}
                  </div>
                )}
              </div>

            </S4Section>
              </div>

            </div>
          </div>

              {/* One commercial workspace, with a primary view switch. This
                  avoids an overly long stack while preserving both the decision
                  surface and the detailed receipt the agent needs in a call. */}
              <div style={{ padding: '0 20px 18px', background: WF.panel, border: `1px solid ${WF.line}`, borderRadius: 12, minWidth: 0, boxShadow: '0 1px 2px rgba(15,23,42,0.04)', overflow: 'hidden' }}>
                <div
                  role="tablist"
                  aria-label="Booking financial view"
                  style={{
                    display: 'grid', gridTemplateColumns: '1fr 1fr',
                    margin: '0 -20px 16px', padding: '0 12px',
                    background: WF.fill, borderBottom: `1px solid ${WF.line}`,
                  }}>
                  {['Order Summary', 'Price Breakdown'].map((view) => {
                    const active = commercialView === view;
                    return (
                      <button
                        key={view}
                        type="button"
                        role="tab"
                        aria-selected={active}
                        onClick={() => setCommercialView(view)}
                        style={{
                          minHeight: 44, padding: '0 8px', border: 'none',
                          borderBottom: active ? `2px solid ${WF.accent}` : '2px solid transparent',
                          background: 'transparent', color: active ? WF.ink : WF.inkSoft,
                          fontSize: 11.5, fontWeight: active ? 800 : 650,
                          letterSpacing: 0.1, cursor: 'pointer',
                        }}>
                        {view}
                      </button>
                    );
                  })}
                </div>

                {commercialView === 'Order Summary' ? (
                  <div role="tabpanel" aria-label="Order Summary">
                    <div style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.5, color: WF.inkLabel, textTransform: 'uppercase', marginBottom: 3 }}>Payment terms</div>
                      <div style={{ fontSize: 10.5, color: WF.inkSoft, marginBottom: 7 }}>Choose what the guest pays when this booking is confirmed.</div>
                      <S4PaymentTerms q={q} value={st.paymentMode} onChange={(m) => setSt({ paymentMode: m })} />
                    </div>

                    <div style={{ paddingTop: 14, borderTop: S4_RULE }}>
                      <S4Option label="Promotions">
                        <S4Promotions
                          q={q}
                          value={st.appliedCoupon}
                          customCode={st.customCode}
                          onSelect={(c) => setSt({ appliedCoupon: c })}
                          onCodeChange={(customCode) => setSt({ customCode })}
                          onApply={() => {
                            const code = (st.customCode || '').trim();
                            if (code) setSt({ appliedCoupon: code });
                          }} />
                      </S4Option>
                    </div>
                  </div>
                ) : (
                  <div role="tabpanel" aria-label="Price Breakdown">
                    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 10, marginBottom: 8 }}>
                      <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.5, color: WF.inkLabel, textTransform: 'uppercase' }}>Pricing lens</div>
                      <div style={{ fontSize: 9.5, color: WF.inkSoft }}>Verify booking-level charges</div>
                    </div>

                {/* Global ┊ Cabin-wise — the same lens the Step 1 rail offers on
                    "Your selection", brought to the receipt. One booking has two
                    readings an agent needs: the ledger they verify against the
                    contract, and the per-room cut they read back to a guest who
                    asks "what is *our* room costing". Hidden until there is
                    pricing at all — a toggle over an empty state offers a choice
                    between two blanks. */}
                {q.status !== 'empty' && (
                  <div style={{ marginBottom: 12 }}>
                    <SPSegmented
                      options={['Global Details', 'Cabin-wise Details']}
                      value={summaryView}
                      onChange={setSummaryView} />
                  </div>
                )}

                {q.status === 'empty' ? (
                  <div style={{ fontSize: 12, color: WF.inkSoft, fontStyle: 'italic' }}>Select a sailing and cabin to see pricing.</div>
                ) : cw ? (
                  <>
                    <SPCabinDetails b={st} p={q} />

                    {/* Reconcile room-level receipts with charges that only
                        exist at booking level. Keeping this in a bounded card
                        makes the pricing hierarchy explicit: rooms first,
                        booking-wide adjustments second, confirmed total last. */}
                    {cw.rooms.length > 0 && (
                      <div style={{
                        marginTop: 12, border: `1px solid ${WF.line}`, borderRadius: 9,
                        overflow: 'hidden', background: '#FFFFFF',
                        boxShadow: '0 1px 2px rgba(15,23,42,0.08)',
                      }}>
                        <div style={{ padding: '11px 12px 9px', borderBottom: S4_RULE, background: WF.fill }}>
                          <div style={{
                            fontSize: 10.5, fontWeight: 800, color: WF.inkLabel,
                            letterSpacing: 0.55, textTransform: 'uppercase',
                          }}>Booking total reconciliation</div>
                          <div style={{ marginTop: 3, fontSize: 9.5, lineHeight: 1.35, color: WF.inkSoft }}>
                            Room charges plus booking-level adjustments
                          </div>
                        </div>

                        <div style={{ padding: '4px 12px' }}>
                          <div style={{
                            display: 'grid', gridTemplateColumns: '22px minmax(0, 1fr) auto',
                            alignItems: 'center', columnGap: 9, minHeight: 45,
                            borderBottom: `1px solid ${WF.lineSoft}`,
                          }}>
                            <div aria-hidden="true" style={{
                              width: 20, height: 20, borderRadius: 6, display: 'grid', placeItems: 'center',
                              background: WF.fill, border: `1px solid ${WF.line}`, color: WF.inkSoft,
                              fontSize: 10, fontWeight: 800,
                            }}>=</div>
                            <div style={{ minWidth: 0 }}>
                              <div style={{ fontSize: 10.5, fontWeight: 750, color: WF.ink }}>Room charges</div>
                              <div style={{ marginTop: 1, fontSize: 9.5, color: WF.inkSoft }}>{cw.rooms.length} room subtotals</div>
                            </div>
                            <div className="s4-money" style={{ fontSize: 11.5, fontWeight: 800, color: WF.ink }}>{money(roomsSubtotal)}</div>
                          </div>

                          <div style={{
                            display: 'grid', gridTemplateColumns: '22px minmax(0, 1fr) auto',
                            alignItems: 'center', columnGap: 9, minHeight: 45,
                            borderBottom: q.couponDisc !== 0 ? `1px solid ${WF.lineSoft}` : 'none',
                          }}>
                            <div aria-hidden="true" style={{
                              width: 20, height: 20, borderRadius: 6, display: 'grid', placeItems: 'center',
                              background: WF.accentTint, border: `1px solid ${WF.accentLine}`, color: WF.accent,
                              fontSize: 12, fontWeight: 800,
                            }}>+</div>
                            <div style={{ minWidth: 0 }}>
                              <div style={{ fontSize: 10.5, fontWeight: 750, color: WF.ink }}>Trip protection</div>
                              <div style={{ marginTop: 1, fontSize: 9.5, color: WF.inkSoft }}>Applied to the whole booking</div>
                            </div>
                            <div className="s4-money" style={{ fontSize: 11.5, fontWeight: 700, color: WF.ink }}>{money(q.protectionTotal)}</div>
                          </div>

                          {q.couponDisc !== 0 && (
                            <div style={{
                              display: 'grid', gridTemplateColumns: '22px minmax(0, 1fr) auto',
                              alignItems: 'center', columnGap: 9, minHeight: 45,
                            }}>
                              <div aria-hidden="true" style={{
                                width: 20, height: 20, borderRadius: 6, display: 'grid', placeItems: 'center',
                                background: WF.fill, border: `1px solid ${WF.line}`, color: WF.inkSoft,
                                fontSize: 12, fontWeight: 800,
                              }}>−</div>
                              <div style={{ minWidth: 0 }}>
                                <div style={{ fontSize: 10.5, fontWeight: 750, color: WF.ink }}>Promotion</div>
                                <div style={{ marginTop: 1, fontSize: 9.5, color: WF.inkSoft }}>{st.appliedCoupon || 'Applied offer'}</div>
                              </div>
                              <div className="s4-money" style={{ fontSize: 11.5, fontWeight: 700, color: WF.ink }}>{money(q.couponDisc)}</div>
                            </div>
                          )}
                        </div>

                        <div style={{
                          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
                          padding: '11px 12px', borderTop: `1px solid ${WF.accentLine}`, background: WF.accentTint,
                        }}>
                          <div>
                            <div style={{ fontSize: 10.5, fontWeight: 800, color: WF.ink }}>Final booking total</div>
                            <div style={{ marginTop: 1, fontSize: 9.5, color: WF.inkSoft }}>Room charges + protection − savings</div>
                          </div>
                          <div className="s4-money" style={{ fontSize: 15, fontWeight: 850, color: WF.ink }}>{money(q.total)}</div>
                        </div>
                      </div>
                    )}
                  </>
                ) : (
                  <S4GlobalPriceBreakdown
                    q={q}
                    totalGuests={totalGuests}
                    addOnsTotal={addOnsTotal}
                    govtTaxes={govtTaxes}
                    cruiseFees={cruiseFees}
                    promotion={st.appliedCoupon} />
                )}

                  </div>
                )}

                {/* Amount and booking actions stay available in either view,
                    so switching to the detailed receipt never hides the next
                    step or forces the agent to navigate back before acting. */}
                <div style={{ marginTop: 16, paddingTop: 16, borderTop: S4_RULE }}>
                  <S4TotalsStats q={q} />

                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 10 }}>
                    <button
                      onClick={() => q.status === 'final' && alert('Booking submitted! (Demo only)')}
                      disabled={q.status !== 'final'}
                      className="s4-btn s4-primary"
                      title={q.status !== 'final' ? 'Choose a sailing, cabin and farecode to confirm' : undefined}
                      style={{ width: '100%', minHeight: 40, padding: '10px 14px', fontSize: 13.5, fontWeight: 700, borderRadius: 8 }}>Confirm booking</button>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ position: 'relative', flex: 1 }}>
                        <button
                          onClick={() => setShowHoldMenu((v) => !v)}
                          className="s4-btn s4-secondary"
                          style={{ width: '100%', minHeight: 34, padding: '8px 14px', fontSize: 12, fontWeight: 600, borderRadius: 7 }}>
                          Hold
                        </button>
                        {showHoldMenu && (
                          <>
                            <div onClick={() => setShowHoldMenu(false)} style={{ position: 'fixed', inset: 0, zIndex: 40 }} />
                            <div style={{
                              position: 'absolute', bottom: '100%', left: 0, marginBottom: 6, zIndex: 41,
                              width: 160, background: '#fff', border: '1px solid #E2E8F0', borderRadius: 9,
                              boxShadow: '0 12px 32px rgba(15,31,61,0.16)', overflow: 'hidden',
                            }}>
                              <div style={{ padding: '8px 12px 6px', fontSize: 10.5, fontWeight: 700, color: '#475569', textTransform: 'uppercase', letterSpacing: 0.5 }}>
                                Hold for
                              </div>
                              {['24h', '48h', '72h'].map((d) => (
                                <button
                                  key={d}
                                  onClick={() => { setSt({ holdDur: d }); setShowHoldMenu(false); alert(`Booking held for ${d}. (Demo only)`); }}
                                  className="s4-btn"
                                  style={{
                                    display: 'block', width: '100%', padding: '9px 12px', border: 'none',
                                    background: 'transparent', color: '#0F172A', fontSize: 12.5, fontWeight: 500,
                                    textAlign: 'left',
                                  }}
                                  onMouseEnter={(e) => { e.currentTarget.style.background = '#F8FAFC'; }}
                                  onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}>
                                  {d}
                                </button>
                              ))}
                            </div>
                          </>
                        )}
                      </div>
                      <button
                        onClick={discard}
                        className="s4-btn s4-quiet"
                        style={{ minHeight: 34, padding: '8px 12px', fontSize: 12, fontWeight: 600, borderRadius: 7 }}>Discard</button>
                    </div>
                  </div>
                </div>
              </div>

            </div>
            {/* ── end booking record ┊ order summary grid ── */}

        </div>
      </div>

      {/* Guest edit modal. `key` remounts it per traveller so the tab resets to
          Guest details instead of inheriting the previous traveller's tab. */}
      {manageTarget !== null && (
        <S4EditModal
          key={manageTarget.key}
          target={manageTarget}
          draftSupps={draftSupps}
          setDraftQty={setDraftQty}
          draftGuest={draftGuest}
          setDraftGuestField={setDraftGuestField}
          onPickDirectory={applyDirectoryPerson}
          onSave={saveManage}
          onCancel={() => setManageTarget(null)} />
      )}
    </WFAppShell>
  );
}

window.Step4App = Step4App;
</script>

<!-- 8 · Step router ──────────────────────────────────────────────────────── -->
<script type="text/babel">
// The router owns the booking. Steps receive it as props and never hold their
// own copy, so switching steps cannot drop a field — the old design gave each
// step a private useState seeded from a different storage key, and Step 2
// overwrote the shared snapshot with its narrower object on every keystroke.
function BookingFlowRouter() {
  const [booking, setBooking] = React.useState(loadBooking);
  const step = booking.step || 1;

  React.useEffect(function () {
    saveBooking(booking);
  }, [booking]);

  // Accepts a patch object or an updater fn, so existing call sites written as
  // `setSt(s => ({...s, x}))` keep working unchanged. `replace` is used by
  // Discard to reset rather than merge.
  const update = React.useCallback(function (changesOrFn, opts) {
    setBooking(function (prev) {
      const changes = typeof changesOrFn === 'function' ? changesOrFn(prev) : changesOrFn;
      if (opts && opts.replace) return normalizeBooking(changes);
      return { ...prev, ...changes };
    });
  }, []);

  const navigate = React.useCallback(function (n) {
    setBooking(function (prev) { return { ...prev, step: n }; });
  }, []);

  React.useEffect(function () {
    window.__bookingNavigate = navigate;
    return function () { delete window.__bookingNavigate; };
  }, [navigate]);

  const props = { booking: booking, update: update, navigate: navigate };
  if (step === 1) return <Step2App {...props} />;
  if (step === 2) return <Step3App {...props} />;
  if (step === 3) return <Step4App {...props} />;
  return null;
}

window.BookingFlowRouter = BookingFlowRouter;

ReactDOM.createRoot(document.getElementById('root')).render(<BookingFlowRouter />);
</script>
